name: spring-6-microservices
services:
  mysql:
    container_name: mysql
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=restdb
      - MYSQL_USER=restadmin
      - MYSQL_PASSWORD=password
    expose:
      - 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIdE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  auth-server:
    container_name: auth-server
    image: spring-6-auth-server:0.0.1-SNAPSHOT
    expose:
      - 9000
    ports:
      - 9000:9000
  rest-mvc:
    container_name: rest-mvc
    image: spring-7-rest-mvc:0.0.1-SNAPSHOT
    expose:
      - 8081
    ports:
      - 8081:8081
    environment:
      - SPRING_PROFILES_ACTIVE=mysqllocal
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/restdb
      - SERVER_PORT=8081
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
  gateway:
    container_name: gateway
    image: spring-6-gateway:0.0.1-SNAPSHOT
    expose:
      - 8080
    ports:
      - 8080:8080
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - auth-server
      - rest-mvc
  cold-service:
    container_name: cold-service
    image: spring-6-cold-service:0.0.1-SNAPSHOT
    expose:
      - 8080
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
  icecold-service:
    container_name: icecold-service
    image: spring-6-icecold-service:0.0.1-SNAPSHOT
    expose:
      - 8080
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
  cool-service:
    container_name: cool-service
    image: spring-6-cool-service:0.0.1-SNAPSHOT
    expose:
      - 8080
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka