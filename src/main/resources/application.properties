server.port=8081
spring.application.name=spring-7-rest-mvc
logging.level.guru.springframework=DEBUG
logging.level.org.zalando.logbook=trace

spring.flyway.enabled=false
spring.docker.compose.enabled=false

spring.security.user.name=user1
spring.security.user.password=password

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-server:9000/oauth2/jwks

management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

spring.threads.virtual.enabled=true
# without virtual threads - 617 MB
# with virtual threads - 454 MB

spring.kafka.consumer.group-id=sfg
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

logging.level.org.springframework.web=trace
logging.level.org.springframework.security=trace

spring.cache.cache-names=beerCache,beerListCache

