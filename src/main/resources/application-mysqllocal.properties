spring.datasource.username=restadmin
spring.datasource.password=password
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/restdb?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
spring.jpa.database=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.flyway.enabled=true
spring.docker.compose.enabled=true
spring.datasource.hikari.pool-name=RestDB-Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.data-source-class-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-class-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-class-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-class-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-class-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-class-properties.rewriteSessionStatements=true
spring.datasource.hikari.data-source-class-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-class-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-class-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-class-properties.maintainTimeStats=true

